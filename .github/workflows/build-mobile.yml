name: Build Mobile Apps (APK + IPA)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  NODE_VERSION: '22'

jobs:
  # ─────────────────────────────────────────────────────────
  # ANDROID JOB
  # ─────────────────────────────────────────────────────────
  build-android:
    name: 🤖 Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install Android SDK 36 + Build Tools
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          yes | sdkmanager --licenses || true

      - name: 📦 Install client dependencies
        working-directory: client
        run: npm install

      - name: 🏗️ Build Vite web app
        working-directory: client
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: npm run build

      - name: 📱 Add Android platform fresh
        working-directory: client
        run: |
          rm -rf android
          npx cap add android

      - name: 🔐 Patch AndroidManifest.xml with permissions
        run: |
          cat > client/android/app/src/main/AndroidManifest.xml << 'MANIFEST_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/AppTheme">
                  <activity
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode|navigation|density"
                      android:name=".MainActivity"
                      android:label="@string/title_activity_main"
                      android:theme="@style/AppTheme.NoActionBarLaunch"
                      android:launchMode="singleTask"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths"></meta-data>
                  </provider>
              </application>
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />
          </manifest>
          MANIFEST_EOF

      - name: 🔧 Create local.properties with SDK path
        working-directory: client/android
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          cat local.properties
          chmod +x gradlew

      - name: 🏗️ Build Android Debug APK
        working-directory: client/android
        run: ./gradlew assembleDebug --no-daemon

      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DocAuth-India-debug.apk
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  # ─────────────────────────────────────────────────────────
  # IOS JOB
  # ─────────────────────────────────────────────────────────
  build-ios:
    name: 🍎 Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 🍎 Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: 📦 Install client dependencies
        working-directory: client
        run: npm install

      - name: 🏗️ Build Vite web app
        working-directory: client
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: npm run build

      - name: 📱 Add iOS platform fresh
        working-directory: client
        run: |
          rm -rf ios
          npx cap add ios

      - name: 🔐 Patch Info.plist with permissions
        working-directory: client/ios/App/App
        run: |
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'DocAuth India requires camera access to scan identity documents.'" Info.plist 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription 'DocAuth India requires camera access to scan identity documents.'" Info.plist

          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'DocAuth India requires photo library access to upload documents.'" Info.plist 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryUsageDescription 'DocAuth India requires photo library access to upload documents.'" Info.plist

          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" Info.plist 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :NSAppTransportSecurity:NSAllowsArbitraryLoads true" Info.plist

      - name: 📦 Resolve Swift Package dependencies
        working-directory: client/ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -resolvePackageDependencies \
            -derivedDataPath DerivedData

      - name: 🏗️ Build iOS app (simulator, unsigned)
        working-directory: client/ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: 📦 Package IPA
        run: |
          APP_PATH=$(find client/ios/App/DerivedData -name "App.app" -type d | grep -v dSYM | head -1)
          echo "App found at: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r DocAuth-India.ipa Payload
          rm -rf Payload
          ls -lh DocAuth-India.ipa

      - name: 📤 Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DocAuth-India.ipa
          path: DocAuth-India.ipa
          retention-days: 30
