name: Build Mobile Apps (APK + IPA)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  NODE_VERSION: '22'

jobs:
  # ─────────────────────────────────────────────────────────
  # ANDROID JOB
  # ─────────────────────────────────────────────────────────
  build-android:
    name: 🤖 Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📦 Install client dependencies
        working-directory: client
        run: npm install

      - name: 🏗️ Build Vite web app
        working-directory: client
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: npm run build

      - name: 📱 Sync Capacitor Android
        working-directory: client
        run: npx cap sync android

      - name: 🔧 Make Gradlew executable
        working-directory: client/android
        run: chmod +x gradlew

      - name: 📋 Show Android SDK info
        working-directory: client/android
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ./gradlew --version

      - name: 🏗️ Build Android Debug APK
        working-directory: client/android
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 📤 Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DocAuth-India-debug.apk
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  # ─────────────────────────────────────────────────────────
  # IOS JOB — Uses Swift Package Manager (NOT CocoaPods)
  # ─────────────────────────────────────────────────────────
  build-ios:
    name: 🍎 Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📦 Install client dependencies
        working-directory: client
        run: npm install

      - name: 🏗️ Build Vite web app
        working-directory: client
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: npm run build

      - name: 📱 Sync Capacitor iOS
        working-directory: client
        run: npx cap sync ios

      - name: 🔍 Show Xcode version and schemes
        working-directory: client/ios/App
        run: |
          xcode-select -p
          xcodebuild -version
          xcodebuild -list -project App.xcodeproj || true

      - name: 📦 Resolve Swift Package Manager dependencies
        working-directory: client/ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -resolvePackageDependencies

      - name: 🏗️ Build iOS app (unsigned simulator build)
        working-directory: client/ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: 📦 Package into IPA
        run: |
          APP_PATH=$(find client/ios/App/DerivedData -name "App.app" -type d | grep -v dSYM | head -1)
          echo "Found app at: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r DocAuth-India.ipa Payload
          rm -rf Payload
          ls -lh DocAuth-India.ipa

      - name: 📤 Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: DocAuth-India.ipa
          path: DocAuth-India.ipa
          retention-days: 30
