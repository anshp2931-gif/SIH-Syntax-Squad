name: Build Mobile Apps (APK + IPA)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:  # Allow manual trigger from GitHub Actions UI

env:
  NODE_VERSION: '22'

jobs:
  # ─────────────────────────────────────────────────────────
  # ANDROID JOB — Builds a debug APK on Ubuntu
  # ─────────────────────────────────────────────────────────
  build-android:
    name: 🤖 Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📦 Install client dependencies
        working-directory: client
        run: npm ci

      - name: 🏗️ Build Vite web app
        working-directory: client
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: npm run build

      - name: 📱 Sync Capacitor Android
        working-directory: client
        run: npx cap sync android

      - name: 🔧 Make Gradlew executable
        working-directory: client/android
        run: chmod +x gradlew

      - name: 🏗️ Build Android Debug APK
        working-directory: client/android
        run: ./gradlew assembleDebug --no-daemon

      - name: 📤 Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DocAuth-India-debug.apk
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  # ─────────────────────────────────────────────────────────
  # IOS JOB — Builds an IPA on macOS (requires macOS runner)
  # ─────────────────────────────────────────────────────────
  build-ios:
    name: 🍎 Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: 📦 Install client dependencies
        working-directory: client
        run: npm ci

      - name: 🏗️ Build Vite web app
        working-directory: client
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: npm run build

      - name: 📱 Sync Capacitor iOS
        working-directory: client
        run: npx cap sync ios

      - name: 📋 List Xcode schemes
        working-directory: client/ios/App
        run: xcodebuild -list -workspace App.xcworkspace

      - name: 🏗️ Build iOS app (unsigned, no provisioning required)
        working-directory: client/ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: 📦 Package IPA (simulator build)
        run: |
          APP_PATH=$(find client/ios/App/DerivedData -name "App.app" -type d | head -1)
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r DocAuth-India.ipa Payload
          rm -rf Payload

      - name: 📤 Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: DocAuth-India.ipa
          path: DocAuth-India.ipa
          retention-days: 30
